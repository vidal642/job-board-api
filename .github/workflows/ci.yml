name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12.3"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify compilation with compileall
        run: |
          python -m compileall .

      - name: Test FastAPI application import
        env:
          MONGODB_URI: mongodb://localhost:27017
          DATABASE_NAME: job_board_ci
          COLLECTION_NAME: ofertas
        run: |
          python -c "import main; print('FastAPI application imported successfully')"
